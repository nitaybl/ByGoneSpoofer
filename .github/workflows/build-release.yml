name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create/publish a release for (e.g. v4.7.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller --clean --noconfirm scripts/ByGoneSpoofer.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ByGoneSpoofer.exe")) {
            Write-Error "Build failed: dist/ByGoneSpoofer.exe not found"
            exit 1
          }
          Get-Item "dist/ByGoneSpoofer.exe" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByGoneSpoofer-exe
          path: dist/ByGoneSpoofer.exe
          if-no-files-found: error

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the pushed tag; on manual dispatch the action
          # creates this tag + release itself (no local tag push required).
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: dist/ByGoneSpoofer.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
